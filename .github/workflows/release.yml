name: Release Obsidian Plugin

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Validate release tag format
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$TAG_NAME" == v* ]]; then
            echo "Invalid tag format ($TAG_NAME). Obsidian release tags must not include a leading v prefix."
            echo "Use a tag like 1.0.3 instead of v1.0.3."
            exit 1
          fi

          if [[ ! "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ($TAG_NAME) does not match semantic version format (x.y.z)."
            exit 1
          fi

      - name: Verify release version
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$TAG_NAME" != "$MANIFEST_VERSION" ]; then
            echo "Tag version ($TAG_NAME) does not match manifest version ($MANIFEST_VERSION)."
            exit 1
          fi

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
